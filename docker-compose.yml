services:
  nse-alert:
    build: .
    container_name: nse-alert
    # unless-stopped retries forever, which is wrong for a credential error
    # that cannot self-heal (e.g. an expired Kite token) — that produced a
    # silent 13-restart crash loop on 2026-09-18 with no alert. Three
    # attempts then stop is correct: a stopped container is far more visible
    # (`docker compose ps` shows Exited) than one stuck Restarting forever.
    # `watch` itself now alerts + exits non-zero on a bad token before this
    # limit is even hit — see docs/RCA-2026-09-17.md P4.
    restart: on-failure:3
    # Match the host `ubuntu` user (uid/gid 1000 on the Lightsail VM) so the
    # container and host-side cron both write .nse_alert/ as the same owner.
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      STATE_DIR: /data/.nse_alert
      # Prefer kite in cloud; override in .env if needed
      FEED_MODE: ${FEED_MODE:-kite}
    volumes:
      # Bind-mount so `uv run nse-alert confirm` on the host sees the same
      # orders.json as the container (named volumes caused "No pending order").
      - ./.nse_alert:/data/.nse_alert
      - ./universes:/app/universes:ro
      - ./.env:/app/.env:ro
    # Uncomment when running `docker compose run --service-ports nse-alert nse-alert login`
    # ports:
    #   - "8765:8765"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
